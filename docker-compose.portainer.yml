version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bekleidung-backend:latest
    container_name: bekleidung-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3077:3077"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3077
      - HOST=0.0.0.0
      - APP_HOST=${APP_HOST:-10.56.131.165}
      - FRONTEND_PORT=3078
      - DATABASE_URL=file:/app/data/bekleidung.db
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-be790d07-21e7-4658-9556-3fae61284778}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-03a7bfec-90e5-4c23-ba88-25f014c62f74}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-https://10.56.131.165:3078/auth/callback}
      - AZURE_AUTHORITY=https://login.microsoftonline.com/${AZURE_TENANT_ID:-be790d07-21e7-4658-9556-3fae61284778}
      - JWT_SECRET=${JWT_SECRET:-bekleidung_app_secure_key_2025_production_autohaus}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=https://${APP_HOST:-10.56.131.165}:${FRONTEND_PORT:-3078}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=5242880
      - ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/webp
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION_DAYS=30
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - SMTP_HOST=${SMTP_HOST:-smtp.office365.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-edv@autohaus-graupner.de}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-Garderobe System <edv@autohaus-graupner.de>}
      - EMAIL_MODE=${EMAIL_MODE}
      - TEST_EMAIL_ADDRESS=${TEST_EMAIL_ADDRESS}
    volumes:
      - ./.env:/app/.env:ro
      - bekleidung-data:/app/data
      - bekleidung-uploads:/app/uploads
      - bekleidung-backups:/app/backups
      - bekleidung-logs:/app/logs
    networks:
      - bekleidung-network
    healthcheck:
      test: ["CMD", "test", "-f", "/app/cert.pfx"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.bekleidung.description=Bekleidung Backend API"
      - "com.bekleidung.version=production"
      - "com.bekleidung.environment=production"

  # Frontend - Nginx mit SSL Reverse Proxy
  frontend:
    image: bekleidung-frontend:latest
    container_name: bekleidung-frontend-prod
    restart: unless-stopped
    ports:
      - "3078:443"
      - "8080:80"
    environment:
      - VITE_API_URL=https://${APP_HOST:-10.56.131.165}:3077/api
      - VITE_AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-03a7bfec-90e5-4c23-ba88-25f014c62f74}
      - VITE_AZURE_TENANT_ID=${AZURE_TENANT_ID:-be790d07-21e7-4658-9556-3fae61284778}
      - VITE_AZURE_REDIRECT_URI=https://${APP_HOST:-10.56.131.165}:3078/auth/callback
    volumes:
      # SSL Zertifikate werden auf dem Portainer-Server bereitgestellt
      - bekleidung-ssl:/etc/nginx/ssl:ro
      - /opt/bekleidung/frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bekleidung-network
    labels:
      - "com.bekleidung.description=Bekleidung Frontend"
      - "com.bekleidung.version=production"
      - "com.bekleidung.environment=production"

networks:
  bekleidung-network:
    driver: bridge
    labels:
      - "project=bekleidung"

volumes:
  bekleidung-data:
    driver: local
    labels:
      - "purpose=data"
      - "backup=daily"
  bekleidung-uploads:
    driver: local
    labels:
      - "purpose=uploads"
      - "backup=weekly"
  bekleidung-backups:
    driver: local
    labels:
      - "purpose=backups"
      - "backup=daily"
  bekleidung-logs:
    driver: local
    labels:
      - "purpose=logs"
  bekleidung-ssl:
    driver: local
    labels:
      - "purpose=ssl-certificates"
